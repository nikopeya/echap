<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 72" width="320" height="72" fill="none">
  <defs>
    <filter id="hBlkShadow" x="-15%" y="-15%" width="130%" height="140%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="5" stdDeviation="4" flood-color="#000000" flood-opacity="0.25" />
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.15" />
    </filter>
    <linearGradient id="hBlkBase" x1="42" y1="12" x2="42" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#27272A" />
      <stop offset="70%" stop-color="#18181B" />
      <stop offset="100%" stop-color="#09090B" />
    </linearGradient>
    <linearGradient id="hBlkTop" x1="42" y1="13" x2="42" y2="56" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3F3F46" />
      <stop offset="25%" stop-color="#27272A" />
      <stop offset="85%" stop-color="#18181B" />
      <stop offset="100%" stop-color="#09090B" />
    </linearGradient>
    <linearGradient id="hBlkSheen" x1="42" y1="13" x2="42" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- === RECTANGULAR MAC KEYCAP SPACE BLACK (Width 70, Height 46) === -->
  <g transform="translate(4, 2)">
    <rect x="6" y="10" width="70" height="46" rx="9" fill="url(#hBlkBase)" filter="url(#hBlkShadow)" />
    <path d="M6 50 C6 54 10 56 16 56 H66 C72 56 76 54 76 50 Z" fill="#000000" opacity="0.8" />
    <rect x="7" y="11" width="68" height="42" rx="7.5" fill="url(#hBlkTop)" />
    <rect x="7" y="11" width="68" height="42" rx="7.5" fill="url(#hBlkSheen)" />
    <rect x="7" y="11" width="68" height="42" rx="7.5" stroke="#52525B" stroke-width="0.8" stroke-opacity="0.45" />
    <path d="M14 12 H68" stroke="#A1A1AA" stroke-width="1" stroke-linecap="round" stroke-opacity="0.7" />
    <!-- Legend "Echap" in Bottom-Left -->
    <text x="15" y="42.5" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Plus Jakarta Sans', 'Inter', sans-serif" font-size="11.5" font-weight="700" fill="#FFFFFF" text-anchor="start" letter-spacing="-0.02em">Echap</text>
  </g>

  <!-- === BRAND WORDMARK "ECHAP" === -->
  <text x="96" y="40" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Plus Jakarta Sans', 'Inter', sans-serif" font-size="28" font-weight="800" letter-spacing="0.06em" fill="#09090B">ECHAP</text>

  <!-- Punchy Tagline: "Libérez-vous" -->
  <text x="97" y="55" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Inter', sans-serif" font-size="11" font-weight="600" letter-spacing="0.04em" fill="#71717A">Libérez-vous</text>
</svg>