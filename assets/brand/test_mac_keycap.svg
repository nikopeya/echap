<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 200" width="260" height="200" fill="none">
  <defs>
    <!-- Realistic Apple chiclet key well shadow -->
    <filter id="macKeyShadow" x="-15%" y="-10%" width="130%" height="135%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#0B132B" flood-opacity="0.28" />
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#0B132B" flood-opacity="0.18" />
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#0B132B" flood-opacity="0.12" />
    </filter>

    <!-- Keycap outer bezel / depth gradient -->
    <linearGradient id="macKeyBase" x1="130" y1="20" x2="130" y2="178" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="70%" stop-color="#1D4ED8" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Apple chiclet top face gradient: silky smooth matte finish -->
    <linearGradient id="macKeyTop" x1="130" y1="22" x2="130" y2="168" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="30%" stop-color="#2563EB" />
      <stop offset="85%" stop-color="#1D4ED8" />
      <stop offset="100%" stop-color="#1E40AF" />
    </linearGradient>

    <!-- Subtle inner surface light reflection -->
    <linearGradient id="macKeySheen" x1="130" y1="22" x2="130" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <!-- Bottom chiclet bevel shadow (shows key travel height) -->
    <linearGradient id="macBottomBevel" x1="130" y1="164" x2="130" y2="178" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#172554" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
  </defs>

  <!-- 1. KEY WELL / BASE with shadow -->
  <rect x="20" y="20" width="220" height="158" rx="22" fill="url(#macKeyBase)" filter="url(#macKeyShadow)" />

  <!-- 2. BOTTOM CHICLET EDGE (subtle key depth ~8px) -->
  <path d="M20 156 C20 168 30 178 44 178 H216 C230 178 240 168 240 156 L240 166 C240 174 230 178 216 178 H44 C30 178 20 174 20 166 Z" fill="url(#macBottomBevel)" opacity="0.9" />

  <!-- 3. TOP CHICLET SURFACE -->
  <rect x="23" y="22" width="214" height="146" rx="19" fill="url(#macKeyTop)" />
  <rect x="23" y="22" width="214" height="146" rx="19" fill="url(#macKeySheen)" />

  <!-- 4. CHICLET RIM STROKE & TOP HIGHLIGHT -->
  <rect x="23" y="22" width="214" height="146" rx="19" stroke="#3B82F6" stroke-width="1" stroke-opacity="0.5" />
  <path d="M42 23.5 H218 C226 23.5 231 26 233 30" stroke="#DBEAFE" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.8" />

  <!-- 5. LEGEND: "Echap" (no accent on E, no underline) -->
  <text x="130" y="106" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Plus Jakarta Sans', 'Inter', sans-serif" font-size="38" font-weight="600" fill="#FFFFFF" text-anchor="middle" letter-spacing="-0.02em">Echap</text>
</svg>